"use strict";

const GEOJSON = JSON.parse(document.getElementById("tractData").textContent);
const CITYWIDE = GEOJSON.citywide;
const CITY_ESTIMATE = CITYWIDE.features[0].properties;
const COLORS = {
  default: ["#f7fbff", "#d9ecf7", "#9ecae1", "#4292c6", "#08519c", "#08306b"],
  colorblind: ["#f0f9e8", "#bae4bc", "#7bccc4", "#c51b8a", "#7a0177", "#49006a"]
};
const LEGEND = {title: "Life Expectancy at Birth", low: "60 years", high: "85 years", stops: [60, 65, 70, 75, 80, 85]};
let activeRamp = "default";
let citywideView = false;

function fillExpression() {
  const expression = ["interpolate", ["linear"], ["to-number", ["get", "life_expectancy"]]];
  LEGEND.stops.forEach((value, i) => expression.push(value, COLORS[activeRamp][i]));
  return ["case", ["==", ["get", "life_expectancy"], null], "#b9b9b4", expression];
}

const map = new maplibregl.Map({
  container: "map",
  style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
  center: [-76.285, 36.9], zoom: 11.5, minZoom: 8, maxZoom: 15,
  attributionControl: false, hash: true
});
map.addControl(new maplibregl.NavigationControl({showCompass: false}), "bottom-right");

function showNorfolk(duration = 1800, wider = false) {
  const mobile = window.innerWidth <= 700;
  let bounds = GEOJSON.metadata.bounds;
  if (wider) {
    const [[west, south], [east, north]] = bounds;
    const dx = (east - west) * .2, dy = (north - south) * .2;
    bounds = [[west - dx, south - dy], [east + dx, north + dy]];
  }
  map.fitBounds(bounds, {
    padding: mobile ? {top: 190, right: 25, bottom: 115, left: 25} : {top: 115, right: 55, bottom: 115, left: 55},
    maxZoom: 12, duration
  });
}

function numberValue(props, key) {
  const value = props[key];
  if (value === null || value === undefined || value === "") return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function formatYears(value, precision = 1) {
  return value === null ? "No estimate" : value.toFixed(precision) + " years";
}

function updateRamp() {
  map.setPaintProperty("tracts-fill", "fill-color", fillExpression());
  map.setPaintProperty("citywide-fill", "fill-color", fillExpression());
  document.getElementById("legendTitle").textContent = citywideView ? "Norfolk as a whole | " + formatYears(CITY_ESTIMATE.life_expectancy) : LEGEND.title;
  document.getElementById("legendLow").textContent = LEGEND.low;
  document.getElementById("legendHigh").textContent = LEGEND.high;
  document.getElementById("legendGradient").style.background = "linear-gradient(to right, " + COLORS[activeRamp].join(", ") + ")";
}

function addNoDataPattern() {
  const size = 16;
  const pixels = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const line = (x + y) % size === 0 || (x - y + size) % size === 0;
      const offset = (y * size + x) * 4;
      pixels.set(line ? [99, 89, 76, 255] : [249, 246, 238, 255], offset);
    }
  }
  map.addImage("no-data-crosshatch", {width: size, height: size, data: pixels});
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const context = canvas.getContext("2d");
  const image = context.createImageData(size, size);
  image.data.set(pixels);
  context.putImageData(image, 0, 0);
  document.getElementById("noDataSwatch").style.backgroundImage = "url(" + canvas.toDataURL("image/png") + ")";
}

map.on("load", () => {
  addNoDataPattern();
  map.addSource("tracts", {type: "geojson", data: GEOJSON});
  map.addLayer({id: "tracts-fill", type: "fill", source: "tracts", filter: ["!=", ["get", "life_expectancy"], null], paint: {

    "fill-opacity": ["interpolate", ["linear"], ["zoom"], 8, .98, 10, .82, 13, .78, 15, .8]
  }});
  map.addLayer({id: "tracts-missing", type: "fill", source: "tracts", filter: ["==", ["get", "life_expectancy"], null], paint: {
    "fill-pattern": "no-data-crosshatch", "fill-opacity": 1
  }});
  map.addLayer({id: "tracts-line", type: "line", source: "tracts", paint: {
    "line-color": "rgba(45,40,32,0.22)",
    "line-width": ["interpolate", ["linear"], ["zoom"], 9, 0, 11, .4, 14, .8]
  }});
  map.addLayer({id: "tracts-hover", type: "line", source: "tracts",
    paint: {"line-color": "#1f1d19", "line-width": 1.7, "line-opacity": .85}, filter: ["==", "GEOID", ""]});
  map.addSource("citywide", {type: "geojson", data: CITYWIDE});
  map.addLayer({id: "citywide-fill", type: "fill", source: "citywide", layout: {visibility: "none"}, paint: {
    "fill-color": fillExpression(),
    "fill-opacity": ["interpolate", ["linear"], ["zoom"], 8, .98, 10, .82, 13, .78, 15, .8]
  }});
  map.addLayer({id: "citywide-line", type: "line", source: "citywide", layout: {visibility: "none"}, paint: {
    "line-color": "rgba(45,40,32,0.45)", "line-width": 1.1
  }});
  if (!window.location.hash) showNorfolk(0);
  const tip = document.getElementById("tooltip");
  function showTract(event) {
    if (!event.features || !event.features.length) return;
    const props = event.features[0].properties;
    if (!citywideView) map.setFilter("tracts-hover", ["==", "GEOID", props.GEOID]);
    document.getElementById("ttValue").textContent = formatYears(numberValue(props, "life_expectancy"));
    tip.style.left = event.point.x + "px";
    tip.style.top = event.point.y + "px";
    tip.classList.add("visible");
    map.getCanvas().style.cursor = "pointer";
  }
  map.on("mousemove", "tracts-fill", showTract);
  map.on("click", "tracts-fill", showTract);
  map.on("mousemove", "tracts-missing", showTract);
  map.on("click", "tracts-missing", showTract);
  map.on("mousemove", "citywide-fill", showTract);
  map.on("click", "citywide-fill", showTract);
  map.on("mouseleave", "tracts-fill", () => {
    tip.classList.remove("visible");
    map.setFilter("tracts-hover", ["==", "GEOID", ""]);
    map.getCanvas().style.cursor = "";
  });
  map.on("mouseleave", "tracts-missing", () => {
    tip.classList.remove("visible");
    map.setFilter("tracts-hover", ["==", "GEOID", ""]);
    map.getCanvas().style.cursor = "";
  });
  map.on("movestart", () => tip.classList.remove("visible"));
  map.on("mouseleave", "citywide-fill", () => {
    tip.classList.remove("visible");
    map.getCanvas().style.cursor = "";
  });
  document.getElementById("wholeNorfolk").addEventListener("click", () => {
    citywideView = !citywideView;
    tip.classList.remove("visible");
    map.setFilter("tracts-hover", ["==", "GEOID", ""]);
    for (const id of ["tracts-fill", "tracts-missing", "tracts-line", "tracts-hover"]) {
      map.setLayoutProperty(id, "visibility", citywideView ? "none" : "visible");
    }
    for (const id of ["citywide-fill", "citywide-line"]) {
      map.setLayoutProperty(id, "visibility", citywideView ? "visible" : "none");
    }
    const button = document.getElementById("wholeNorfolk");
    button.classList.toggle("active", citywideView);
    button.setAttribute("aria-pressed", String(citywideView));
    button.title = citywideView ? "Return to the census tract estimates for 2010-2015" : "Show the citywide estimate for 2021-2023";
    document.getElementById("mapSubtitle").textContent = citywideView ? "Norfolk as a whole | 2021-2023" : "by Census Tract | 2010-2015";
    document.getElementById("dataSource").textContent = citywideView ? "County Health Rankings 2021-2023" : "CDC USALEEP 2010-2015";
    document.getElementById("missingLegend").hidden = citywideView;
    updateRamp();
    showNorfolk(1200, citywideView);
  });
  document.getElementById("rampDefault").addEventListener("click", () => {
    activeRamp = "default"; updateRamp();
    document.getElementById("rampDefault").classList.add("active");
    document.getElementById("rampCB").classList.remove("active");
    document.getElementById("rampDefault").setAttribute("aria-pressed", "true");
    document.getElementById("rampCB").setAttribute("aria-pressed", "false");
  });
  document.getElementById("rampCB").addEventListener("click", () => {
    activeRamp = "colorblind"; updateRamp();
    document.getElementById("rampCB").classList.add("active");
    document.getElementById("rampDefault").classList.remove("active");
    document.getElementById("rampCB").setAttribute("aria-pressed", "true");
    document.getElementById("rampDefault").setAttribute("aria-pressed", "false");
  });
});
</script></body></html>
